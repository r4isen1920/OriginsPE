name: Build Add-On
on:
    workflow_dispatch:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
    contents: write
    issues: read
    pull-requests: read

jobs:
    build-dev:
        name: Build Development
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: Bedrock-OSS/regolith-action@v1.1.0
              with:
                  profile: build-dev
            - name: Upload dev artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dev-build
                  path: '*-dev.mcaddon'

    build-release:
        name: Build Release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: Bedrock-OSS/regolith-action@v1.1.0
              with:
                  profile: build-release
            - name: Upload release artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: release-build
                  path: '*.mcaddon'

    build:
        name: Create Release
        runs-on: ubuntu-latest
        needs: [build-dev, build-release]
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            - name: Download dev artifacts
              uses: actions/download-artifact@v4
              with:
                  name: dev-build
                  path: ./release-files
            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  name: release-build
                  path: ./release-files
            - name: Collect changes since last tag
              id: collect_changes
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  result-encoding: string
                  script: | #javascript
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const currentRef = context.ref || '';
                      const currentTag = currentRef.replace('refs/tags/', '');

                      const tagsRes = await github.rest.repos.listTags({ owner, repo, per_page: 100 });
                      const tags = tagsRes.data || [];
                      const idx = tags.findIndex(t => t.name === currentTag);
                      const prevTagObj = idx >= 0 && idx + 1 < tags.length ? tags[idx + 1] : (tags.length > 1 && tags[0].name !== currentTag ? tags[0] : null);

                      let sinceISO;
                      let compareUrl = '';
                      if (prevTagObj) {
                        try {
                          const commit = await github.rest.repos.getCommit({ owner, repo, ref: prevTagObj.commit.sha });
                          sinceISO = commit.data.commit.author?.date || commit.data.commit.committer?.date;
                          compareUrl = `https://github.com/${owner}/${repo}/compare/${prevTagObj.name}...${currentTag}`;
                        } catch (e) {
                          sinceISO = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
                        }
                      } else {
                        sinceISO = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
                      }

                      const sinceDate = new Date(sinceISO);

                      const allIssues = await github.paginate(
                        github.rest.issues.listForRepo,
                        { owner, repo, state: 'all', since: sinceISO, per_page: 100 }
                      );

                      const isIssue = (it) => !it.pull_request;
                      const getAssigneeOrCreator = (issue) => {
                        const assignees = issue.assignees || [];
                        if (assignees.length === 0) return issue.user?.login || 'unknown';
                        const names = assignees.slice(0, 4).map(a => a.login).join(', @');
                        return assignees.length > 4 ? `${names} et al.` : names;
                      };

                      const issuesClosed = allIssues
                        .filter(it => isIssue(it) && it.state === 'closed' && it.closed_at && new Date(it.closed_at) >= sinceDate)
                        .map(it => ({
                          number: it.number,
                          title: it.title,
                          url: it.html_url,
                          actor: getAssigneeOrCreator(it)
                        }));

                      const issuesOpened = allIssues
                        .filter(it => isIssue(it) && new Date(it.created_at) >= sinceDate)
                        .map(it => ({
                          number: it.number,
                          title: it.title,
                          url: it.html_url,
                          actor: it.user?.login || 'unknown'
                        }));

                      const closedPRs = await github.paginate(
                        github.rest.pulls.list,
                        { owner, repo, state: 'closed', per_page: 100 }
                      );

                      const prsMerged = closedPRs
                        .filter(pr => pr.merged_at && new Date(pr.merged_at) >= sinceDate)
                        .map(pr => ({
                          number: pr.number,
                          title: pr.title,
                          url: pr.html_url,
                          actor: pr.user?.login || 'unknown'
                        }));

                      return JSON.stringify({
                        currentTag,
                        previousTag: prevTagObj?.name || null,
                        compareUrl,
                        sinceISO,
                        pullRequests: prsMerged,
                        issuesClosed,
                        issuesOpened
                      });
            - name: Generate release notes with Gemini
              id: generate_release_notes
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  CHANGE_CONTEXT: ${{ steps.collect_changes.outputs.result }}
              run: |
                  set -euo pipefail

                  if [ -z "${GEMINI_API_KEY:-}" ]; then
                    echo "GEMINI_API_KEY secret is missing" >&2
                    exit 1
                  fi

                  current_tag="$(echo "$CHANGE_CONTEXT" | jq -r '.currentTag')"
                  previous_tag="$(echo "$CHANGE_CONTEXT" | jq -r '.previousTag // empty')"
                  compare_url="$(echo "$CHANGE_CONTEXT" | jq -r '.compareUrl // empty')"

                  prompt="$(cat <<EOF
                  Create concise GitHub release notes in markdown for tag ${current_tag}.
                  Focus on high impact changes, gameplay impact, fixes, and upgrade notes.
                  Use this structure exactly:
                  # Release ${current_tag}
                  ## Highlights
                  ## Pull requests merged
                  ## Issues closed
                  ## Issues opened
                  ## Notes
                  Rules:
                  - Keep Highlights to 3-6 bullets.
                  - Include markdown links for PRs and issues using the provided URLs.
                  - Mention contributors with @username where available.
                  - If a section has no items, write '- None'.
                  - Do not invent changes that are not in the data.

                  Input data (JSON):
                  ${CHANGE_CONTEXT}
                  EOF
                  )"

                  payload="$(jq -n --arg prompt "$prompt" '{contents: [{parts: [{text: $prompt}]}]}')"

                  gemini_response_file="$(mktemp)"
                  http_status="$(curl -sS -o "$gemini_response_file" -w "%{http_code}" -X POST \
                    -H 'Content-Type: application/json' \
                    "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${GEMINI_API_KEY}" \
                    -d "$payload" || true)"
                  response="$(cat "$gemini_response_file")"

                  generated="$(echo "$response" | jq -r '.candidates[0].content.parts[0].text // empty')"

                  if [ -z "$generated" ]; then
                    echo "Gemini response missing content, using fallback release notes" >&2
                    echo "Gemini HTTP status: ${http_status}" >&2
                    if [ -n "$response" ]; then
                      echo "Gemini response body:" >&2
                      echo "$response" | jq . >&2 || echo "$response" >&2
                    else
                      echo "Gemini response body is empty" >&2
                    fi
                    prs="$(echo "$CHANGE_CONTEXT" | jq -r '.pullRequests[]? | "- [#\(.number)](\(.url)) \(.title) (by @\(.actor))"')"
                    closed="$(echo "$CHANGE_CONTEXT" | jq -r '.issuesClosed[]? | "- [#\(.number)](\(.url)) \(.title) (by @\(.actor))"')"
                    opened="$(echo "$CHANGE_CONTEXT" | jq -r '.issuesOpened[]? | "- [#\(.number)](\(.url)) \(.title) (by @\(.actor))"')"

                    fallback_file="$(mktemp)"
                    {
                      echo "# Release ${current_tag}"
                      if [ -n "$previous_tag" ] && [ -n "$compare_url" ]; then
                        echo
                        echo "Changes since ${previous_tag}: ${compare_url}"
                      fi

                      echo
                      echo "## Pull requests merged"
                      if [ -n "$prs" ]; then
                        echo "$prs"
                      else
                        echo "- None"
                      fi

                      echo
                      echo "## Issues closed"
                      if [ -n "$closed" ]; then
                        echo "$closed"
                      else
                        echo "- None"
                      fi

                      echo
                      echo "## Issues opened"
                      if [ -n "$opened" ]; then
                        echo "$opened"
                      else
                        echo "- None"
                      fi
                    } > "$fallback_file"

                    generated="$(cat "$fallback_file")"
                  fi

                  {
                    echo "result<<EOF"
                    echo "$generated"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"
            - name: List downloaded files
              run: ls -la ./release-files/
            - uses: softprops/action-gh-release@v1
              with:
                  fail_on_unmatched_files: true
                  files: ./release-files/*.mcaddon
                  body: ${{ steps.generate_release_notes.outputs.result }}
